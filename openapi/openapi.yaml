openapi: 3.1.0
info:
  title: SpeechMirror API
  version: 0.1.0
  description: 言镜三端客户端共同使用的接口契约。
servers:
  - url: /api/v1
security:
  - bearerAuth: []
paths:
  /health:
    get:
      operationId: health
      security: []
      responses:
        '200': {description: 服务状态, content: {application/json: {schema: {$ref: '#/components/schemas/Health'}}}}
  /auth/register:
    post:
      operationId: register
      security: []
      requestBody: {$ref: '#/components/requestBodies/Credentials'}
      responses:
        '200': {$ref: '#/components/responses/Tokens'}
  /auth/login:
    post:
      operationId: login
      security: []
      requestBody: {$ref: '#/components/requestBodies/Credentials'}
      responses:
        '200': {$ref: '#/components/responses/Tokens'}
  /auth/refresh:
    post:
      operationId: refreshToken
      security: []
      requestBody: {$ref: '#/components/requestBodies/RefreshToken'}
      responses:
        '200': {$ref: '#/components/responses/Tokens'}
  /auth/logout:
    post:
      operationId: logout
      requestBody: {$ref: '#/components/requestBodies/RefreshToken'}
      responses:
        '200': {$ref: '#/components/responses/Ok'}
  /me:
    get:
      operationId: getMyProfile
      responses:
        '200': {description: 当前用户资料, content: {application/json: {schema: {$ref: '#/components/schemas/UserProfile'}}}}
    put:
      operationId: updateMyProfile
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/UserProfileInput'}}}}
      responses:
        '200': {description: 更新后的用户资料, content: {application/json: {schema: {$ref: '#/components/schemas/UserProfile'}}}}
  /me/avatar:
    get:
      operationId: getMyAvatar
      responses:
        '200': {description: 当前头像, content: {image/png: {schema: {type: string, format: binary}}, image/jpeg: {schema: {type: string, format: binary}}}}
        '404': {description: 尚未设置头像}
    post:
      operationId: uploadMyAvatar
      description: 支持 PNG 和 JPEG，最大 2 MiB。
      requestBody: {required: true, content: {multipart/form-data: {schema: {type: object, required: [file], properties: {file: {type: string, format: binary, maxLength: 2097152}}}}}}
      responses:
        '200': {$ref: '#/components/responses/Ok'}
    delete:
      operationId: deleteMyAvatar
      responses:
        '200': {$ref: '#/components/responses/Ok'}
  /me/activity:
    get:
      operationId: getMyActivity
      parameters:
        - {name: through, in: query, required: false, schema: {type: string, format: date}, description: 点阵结束日期，默认服务端当天}
      responses:
        '200': {description: 最近365天活跃摘要, content: {application/json: {schema: {$ref: '#/components/schemas/ActivitySummary'}}}}
    post:
      operationId: recordAppUse
      requestBody: {required: true, content: {application/json: {schema: {type: object, required: [local_date], properties: {local_date: {type: string, format: date}}}}}}
      responses:
        '200': {$ref: '#/components/responses/Ok'}
  /projects:
    get:
      operationId: listProjects
      responses:
        '200': {description: 项目列表, content: {application/json: {schema: {type: array, items: {$ref: '#/components/schemas/Project'}}}}}
    post:
      operationId: createProject
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/ProjectInput'}}}}
      responses:
        '200': {$ref: '#/components/responses/Project'}
  /projects/{project_id}:
    parameters: [{$ref: '#/components/parameters/ProjectId'}]
    get:
      operationId: getProject
      responses:
        '200': {$ref: '#/components/responses/Project'}
    put:
      operationId: updateProject
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/ProjectPatch'}}}}
      responses:
        '200': {$ref: '#/components/responses/Project'}
    delete:
      operationId: deleteProject
      responses:
        '200': {$ref: '#/components/responses/Ok'}
  /projects/{project_id}/documents:
    parameters: [{$ref: '#/components/parameters/ProjectId'}]
    get:
      operationId: listDocuments
      responses:
        '200': {description: 材料列表, content: {application/json: {schema: {type: array, items: {$ref: '#/components/schemas/Document'}}}}}
    post:
      operationId: uploadDocument
      description: 支持 PDF、PPTX、DOCX、UTF-8 TXT/Markdown、PNG 和 JPEG，扩展名、媒体类型与文件特征必须一致，单文件不超过 25 MiB。
      requestBody: {$ref: '#/components/requestBodies/DocumentUpload'}
      responses:
        '200': {description: 已持久化并排队处理, content: {application/json: {schema: {$ref: '#/components/schemas/Document'}}}}
        '400': {description: 文件格式、内容或大小无效, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
  /documents/{document_id}:
    get:
      operationId: getDocument
      parameters: [{$ref: '#/components/parameters/DocumentId'}]
      responses:
        '200': {description: 材料处理状态与提取文本, content: {application/json: {schema: {$ref: '#/components/schemas/Document'}}}}
  /documents/{document_id}/text:
    put:
      operationId: correctDocumentText
      parameters: [{$ref: '#/components/parameters/DocumentId'}]
      requestBody:
        required: true
        content: {application/json: {schema: {type: object, required: [text], properties: {text: {type: string}}}}}
      responses:
        '200': {description: 已重新索引, content: {application/json: {schema: {$ref: '#/components/schemas/Document'}}}}
  /projects/{project_id}/sessions:
    parameters: [{$ref: '#/components/parameters/ProjectId'}]
    get:
      operationId: listSessions
      responses:
        '200': {description: 训练记录, content: {application/json: {schema: {type: array, items: {$ref: '#/components/schemas/Session'}}}}}
    post:
      operationId: createSession
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/SessionInput'}}}}
      responses:
        '200': {$ref: '#/components/responses/Session'}
  /sessions/{session_id}:
    get:
      operationId: getSession
      parameters: [{$ref: '#/components/parameters/SessionId'}]
      responses:
        '200': {$ref: '#/components/responses/Session'}
  /sessions/{session_id}/metrics:
    post:
      operationId: uploadMetrics
      parameters: [{$ref: '#/components/parameters/SessionId'}]
      requestBody: {required: true, content: {application/json: {schema: {type: object, required: [samples], properties: {samples: {type: array, maxItems: 20000, items: {$ref: '#/components/schemas/MetricSample'}}}}}}}
      responses:
        '200': {$ref: '#/components/responses/Ok'}
  /sessions/{session_id}/audio:
    post:
      operationId: uploadAudio
      description: 音频仅用于 ASR，处理后删除临时文件。
      parameters: [{$ref: '#/components/parameters/SessionId'}]
      requestBody: {$ref: '#/components/requestBodies/FileUpload'}
      responses:
        '200': {description: 识别结果, content: {application/json: {schema: {type: object, required: [transcript], properties: {transcript: {type: string}}}}}}
  /sessions/{session_id}/answer-audio:
    post:
      operationId: transcribeAnswerAudio
      description: 评委回答音频仅用于临时转写，不覆盖训练会话转写，处理后删除临时文件。
      parameters: [{$ref: '#/components/parameters/SessionId'}]
      requestBody: {$ref: '#/components/requestBodies/FileUpload'}
      responses:
        '200': {description: 识别结果, content: {application/json: {schema: {type: object, required: [transcript], properties: {transcript: {type: string}}}}}}
  /sessions/{session_id}/complete:
    post:
      operationId: completeSession
      parameters: [{$ref: '#/components/parameters/SessionId'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/CompleteSession'}}}}
      responses:
        '200': {$ref: '#/components/responses/Session'}
  /sessions/{session_id}/analyze:
    post:
      operationId: analyzeSession
      parameters: [{$ref: '#/components/parameters/SessionId'}]
      responses:
        '200': {$ref: '#/components/responses/Report'}
  /sessions/{session_id}/report:
    get:
      operationId: getReport
      parameters: [{$ref: '#/components/parameters/SessionId'}]
      responses:
        '200': {$ref: '#/components/responses/Report'}
  /projects/{project_id}/questions:
    parameters: [{$ref: '#/components/parameters/ProjectId'}]
    get:
      operationId: listQuestions
      responses:
        '200': {description: 问题列表, content: {application/json: {schema: {type: array, items: {$ref: '#/components/schemas/Question'}}}}}
    post:
      operationId: generateQuestions
      requestBody: {required: true, content: {application/json: {schema: {type: object, properties: {session_id: {type: [string, 'null'], format: uuid}, count: {type: integer, minimum: 1, maximum: 10, default: 5}, regenerate: {type: boolean, default: false}}}}}}
      responses:
        '200': {description: 材料约束的问题, content: {application/json: {schema: {type: array, items: {$ref: '#/components/schemas/Question'}}}}}
  /questions/{question_id}/answers:
    post:
      operationId: submitAnswer
      parameters: [{name: question_id, in: path, required: true, schema: {type: string, format: uuid}}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/AnswerInput'}}}}
      responses:
        '200': {description: 基于材料的回答评价与下一轮追问, content: {application/json: {schema: {$ref: '#/components/schemas/Answer'}}}}
  /projects/{project_id}/trends:
    get:
      operationId: getTrends
      parameters: [{$ref: '#/components/parameters/ProjectId'}]
      responses:
        '200': {description: 历史趋势, content: {application/json: {schema: {$ref: '#/components/schemas/Trends'}}}}
components:
  securitySchemes:
    bearerAuth: {type: http, scheme: bearer, bearerFormat: JWT}
  parameters:
    ProjectId: {name: project_id, in: path, required: true, schema: {type: string, format: uuid}}
    DocumentId: {name: document_id, in: path, required: true, schema: {type: string, format: uuid}}
    SessionId: {name: session_id, in: path, required: true, schema: {type: string, format: uuid}}
  requestBodies:
    Credentials: {required: true, content: {application/json: {schema: {type: object, required: [username, password], properties: {username: {type: string, minLength: 3, maxLength: 32}, password: {type: string, minLength: 8, maxLength: 128, format: password}}}}}}
    RefreshToken: {required: true, content: {application/json: {schema: {type: object, required: [refresh_token], properties: {refresh_token: {type: string}}}}}}
    DocumentUpload: {required: true, content: {multipart/form-data: {schema: {type: object, required: [file], properties: {file: {type: string, format: binary, maxLength: 26214400}}}}}}
    FileUpload: {required: true, content: {multipart/form-data: {schema: {type: object, required: [file], properties: {file: {type: string, format: binary}}}}}}
  responses:
    Ok: {description: 操作成功, content: {application/json: {schema: {type: object, required: [ok], properties: {ok: {type: boolean}}}}}}
    Tokens: {description: 访问及刷新令牌, content: {application/json: {schema: {$ref: '#/components/schemas/TokenPair'}}}}
    Project: {description: 项目, content: {application/json: {schema: {$ref: '#/components/schemas/Project'}}}}
    Session: {description: 训练记录, content: {application/json: {schema: {$ref: '#/components/schemas/Session'}}}}
    Report: {description: 可解释报告, content: {application/json: {schema: {$ref: '#/components/schemas/ReportEnvelope'}}}}
  schemas:
    Health: {type: object, required: [status, ai_configured, providers], properties: {status: {type: string, const: ok}, ai_configured: {type: boolean, description: 仅当四项AI能力均已配置时为true}, providers: {$ref: '#/components/schemas/AiProviderStatus'}}}
    AiProviderStatus: {type: object, required: [llm, embedding, asr, ocr], properties: {llm: {type: boolean}, embedding: {type: boolean}, asr: {type: boolean}, ocr: {type: boolean}}}
    TokenPair: {type: object, required: [access_token, refresh_token, token_type, expires_in], properties: {access_token: {type: string}, refresh_token: {type: string}, token_type: {type: string, const: Bearer}, expires_in: {type: integer, const: 900}}}
    ProjectInput: {type: object, required: [name], properties: {name: {type: string, minLength: 1, maxLength: 80}, description: {type: [string, 'null'], maxLength: 500}, defense_duration_seconds: {type: integer, minimum: 60, maximum: 1800, default: 300}}}
    ProjectPatch: {type: object, properties: {name: {type: [string, 'null'], minLength: 1, maxLength: 80}, description: {type: [string, 'null'], maxLength: 500}, defense_duration_seconds: {type: [integer, 'null'], minimum: 60, maximum: 1800}}}
    Project: {allOf: [{$ref: '#/components/schemas/ProjectInput'}, {type: object, required: [id, created_at, updated_at, defense_duration_seconds], properties: {id: {type: string, format: uuid}, created_at: {type: string, format: date-time}, updated_at: {type: string, format: date-time}}}]}
    Document: {type: object, required: [id, project_id, filename, media_type, status, created_at], properties: {id: {type: string, format: uuid}, project_id: {type: string, format: uuid}, filename: {type: string}, media_type: {type: string}, status: {type: string, enum: [processing, ready, failed]}, extracted_text: {type: [string, 'null']}, error: {type: [string, 'null']}, created_at: {type: string, format: date-time}}}
    SessionInput: {type: object, properties: {title: {type: [string, 'null']}, target_seconds: {type: [integer, 'null'], minimum: 30, maximum: 1800}, local_video_ref: {type: [string, 'null'], description: 仅限客户端本地引用}, local_date: {type: [string, 'null'], format: date, description: 设备当地日期，用于活跃统计}}}
    UserProfileInput:
      type: object
      required: [purposes, onboarding_completed, research_consent]
      properties:
        bio: {type: [string, 'null'], maxLength: 200}
        identity: {type: [string, 'null'], enum: [本科生, 硕士研究生, 博士研究生, 高职学生, 教师或指导老师, 创业团队成员, 职场人士, 其他, null]}
        identity_other: {type: [string, 'null'], maxLength: 50}
        scenario: {type: [string, 'null'], enum: [毕业答辩, 课程答辩, 创新创业大赛, 学科竞赛, 项目路演, 技术面试, 其他, null]}
        scenario_other: {type: [string, 'null'], maxLength: 50}
        purposes: {type: array, uniqueItems: true, maxItems: 7, items: {type: string, enum: [提升表达, 熟悉项目, 准备评委提问, 发现材料漏洞, 控制答辩时间, 复盘长期进步, 其他]}}
        purpose_other: {type: [string, 'null'], maxLength: 50}
        onboarding_completed: {type: boolean}
        research_consent: {type: boolean, default: false}
    UserProfile:
      allOf:
        - {$ref: '#/components/schemas/UserProfileInput'}
        - type: object
          required: [id, username, has_avatar, created_at, updated_at]
          properties:
            id: {type: string, format: uuid}
            username: {type: string}
            has_avatar: {type: boolean}
            created_at: {type: string, format: date-time}
            updated_at: {type: string, format: date-time}
    ActivityDay: {type: object, required: [date, use_count, practice_count], properties: {date: {type: string, format: date}, use_count: {type: integer, minimum: 0}, practice_count: {type: integer, minimum: 0}}}
    ActivitySummary: {type: object, required: [through, active_days, total_uses, total_practices, current_streak, longest_streak, days], properties: {through: {type: string, format: date}, active_days: {type: integer, minimum: 0}, total_uses: {type: integer, minimum: 0}, total_practices: {type: integer, minimum: 0}, current_streak: {type: integer, minimum: 0}, longest_streak: {type: integer, minimum: 0}, days: {type: array, items: {$ref: '#/components/schemas/ActivityDay'}}}}
    Session: {allOf: [{$ref: '#/components/schemas/SessionInput'}, {type: object, required: [id, project_id, title, status, target_seconds, created_at], properties: {id: {type: string, format: uuid}, project_id: {type: string, format: uuid}, title: {type: string}, status: {type: string}, actual_seconds: {type: [integer, 'null']}, transcript: {type: [string, 'null']}, created_at: {type: string, format: date-time}, completed_at: {type: [string, 'null'], format: date-time}}}]}
    MetricSample: {type: object, required: [timestamp_ms, face_detected, gaze_centered, posture_score, audio_level], properties: {timestamp_ms: {type: integer, format: int64}, face_detected: {type: boolean}, gaze_centered: {type: number, minimum: 0, maximum: 1}, posture_score: {type: number, minimum: 0, maximum: 1}, audio_level: {type: number, minimum: 0, maximum: 1}}}
    CompleteSession: {type: object, required: [actual_seconds], properties: {actual_seconds: {type: integer, minimum: 1, maximum: 3600}, transcript: {type: [string, 'null']}}}
    Evidence: {type: object, required: [chunk_id, quote], properties: {chunk_id: {type: string, format: uuid}, quote: {type: string}}}
    Dimension: {type: object, required: [score, summary, evidence], properties: {score: {type: [integer, 'null'], minimum: 0, maximum: 100, description: 未采集或未完成时为null}, summary: {type: string}, evidence: {type: array, items: {$ref: '#/components/schemas/Evidence'}}}}
    AudioWavePoint: {type: object, required: [timestamp_ms, level], properties: {timestamp_ms: {type: integer, format: int64}, level: {type: number, minimum: 0, maximum: 1}}}
    TimelineIssue: {type: object, required: [timestamp_ms, kind, message], properties: {timestamp_ms: {type: integer, format: int64}, kind: {type: string}, message: {type: string}}}
    ReportPayload:
      type: object
      required: [session_id, actual_seconds, character_count, characters_per_minute, filler_counts, long_pause_count, content, delivery, timing, visual, qa, defense_scores, timeline, suggestions, model_confidence]
      properties:
        session_id: {type: string, format: uuid}
        overall_score: {type: [integer, 'null'], minimum: 0, maximum: 100}
        actual_seconds: {type: integer}
        character_count: {type: integer, minimum: 0}
        characters_per_minute: {type: number, minimum: 0}
        filler_counts: {type: object, additionalProperties: {type: integer, minimum: 0}}
        long_pause_count: {type: [integer, 'null'], minimum: 0}
        audio_waveform: {type: array, items: {$ref: '#/components/schemas/AudioWavePoint'}}
        content: {$ref: '#/components/schemas/Dimension'}
        delivery: {$ref: '#/components/schemas/Dimension'}
        timing: {$ref: '#/components/schemas/Dimension'}
        visual: {$ref: '#/components/schemas/Dimension'}
        qa: {$ref: '#/components/schemas/Dimension'}
        defense_scores: {type: array, items: {$ref: '#/components/schemas/DefenseScoreItem'}}
        timeline: {type: array, items: {$ref: '#/components/schemas/TimelineIssue'}}
        suggestions: {type: array, items: {type: string}}
        model_confidence: {type: [number, 'null'], minimum: 0, maximum: 1}
    DefenseScoreItem: {type: object, required: [label, score, max_score, summary], properties: {label: {type: string}, score: {type: integer, minimum: 0}, max_score: {type: integer, minimum: 1}, summary: {type: string}}}
    ReportEnvelope: {type: object, required: [id, session_id, report, created_at], properties: {id: {type: string, format: uuid}, session_id: {type: string, format: uuid}, created_at: {type: string, format: date-time}, report: {$ref: '#/components/schemas/ReportPayload'}}}
    Question: {type: object, required: [id, project_id, category, question, evidence, created_at], properties: {id: {type: string, format: uuid}, project_id: {type: string, format: uuid}, session_id: {type: [string, 'null'], format: uuid}, category: {type: string}, question: {type: string}, evidence: {type: array, items: {$ref: '#/components/schemas/Evidence'}}, created_at: {type: string, format: date-time}}}
    AnswerInput: {type: object, required: [session_id, answer_text], properties: {session_id: {type: string, format: uuid}, answer_text: {type: string, minLength: 1}, parent_answer_id: {type: [string, 'null'], format: uuid, description: 回答上一轮服务端生成的追问时传入}, request_id: {type: [string, 'null'], maxLength: 128, description: 客户端生成的幂等请求标识，自动重试时保持不变}, elapsed_seconds: {type: [integer, 'null'], minimum: 0, description: 仅累计答辩者回答和准备回答的正计时秒数}}}
    Answer: {type: object, required: [id, question_id, session_id, asked_question, parent_answer_id, answer_text, evaluation, created_at], properties: {id: {type: string, format: uuid}, question_id: {type: string, format: uuid}, session_id: {type: string, format: uuid}, asked_question: {type: string}, parent_answer_id: {type: [string, 'null'], format: uuid}, answer_text: {type: string}, evaluation: {type: object, additionalProperties: true}, created_at: {type: string, format: date-time}}}
    TrendPoint:
      type: object
      required: [session_id, created_at, target_seconds, actual_seconds, duration_deviation_seconds, characters_per_minute, filler_count, filler_per_minute, delivery_score, timing_score, visual_score, content_score, qa_score]
      properties:
        session_id: {type: string, format: uuid}
        created_at: {type: string, format: date-time}
        target_seconds: {type: integer}
        actual_seconds: {type: integer}
        duration_deviation_seconds: {type: integer, description: 实际时长减目标时长，可为负数}
        characters_per_minute: {type: number}
        filler_count: {type: integer, minimum: 0}
        filler_per_minute: {type: number, minimum: 0}
        delivery_score: {type: [integer, 'null'], minimum: 0, maximum: 100}
        timing_score: {type: [integer, 'null'], minimum: 0, maximum: 100}
        visual_score: {type: [integer, 'null'], minimum: 0, maximum: 100}
        content_score: {type: [integer, 'null'], minimum: 0, maximum: 100}
        qa_score: {type: [integer, 'null'], minimum: 0, maximum: 100}
    Trends: {type: object, required: [project_id, points], properties: {project_id: {type: string, format: uuid}, points: {type: array, items: {$ref: '#/components/schemas/TrendPoint'}}}}
    Error: {type: object, required: [code, message], properties: {code: {type: string}, message: {type: string}}}
