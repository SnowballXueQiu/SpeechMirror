services:
  api:
    build:
      context: ..
      dockerfile: services/api/Dockerfile
    restart: unless-stopped
    env_file:
      - ${API_ENV_FILE:-../services/api/.env}
    environment:
      BIND_ADDR: 0.0.0.0:8080
      DATABASE_URL: sqlite://data/speechmirror.sqlite3?mode=rwc
      STORAGE_DIR: data
    volumes:
      - speechmirror_data:/app/data
    ports:
      - "${API_PUBLISH_HOST:-127.0.0.1}:${API_PORT:-48180}:8080"
    expose:
      - "8080"

  caddy:
    image: caddy:2.10-alpine
    restart: unless-stopped
    depends_on:
      - api
    environment:
      DOMAIN: ${DOMAIN:-localhost}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  speechmirror_data:
  caddy_data:
  caddy_config:
